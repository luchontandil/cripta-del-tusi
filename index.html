<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171917">
  <title>Cripta del tusi</title>
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body><main>
  <header><div class="crest" aria-hidden="true">◆</div><h1>Cripta del tusi</h1></header>
  <section id="entry" class="panel gateway">
    <h2>Entrar a la cripta</h2>
    <label>Nombre <input id="name" maxlength="22" placeholder="Aventurero"></label>
    <label>Clase <select id="class"><option value="guardia">Guardián</option><option value="tirador">Arquero</option><option value="mistico">Clérigo</option></select></label>
    <div id="class-preview"></div>
    <button id="solo" class="primary">Jugar en solitario</button>
    <details><summary>Jugar con amigos</summary>
      <button id="create">Crear sala</button>
      <label>Código de sala <input id="code" maxlength="6" placeholder="A1B2C3"></label>
      <button id="join">Unirse</button>
      <label>Dirección del servidor <input id="server" type="url" placeholder="https://tu-servidor.example"></label>
    </details>
  </section>
  <p id="error" role="status"></p>
  <section id="game" hidden>
    <div class="status"><div id="room"></div><button id="copy-code" hidden>Copiar código</button><button id="leave">Salir</button></div>
    <section class="fight-header panel"><h2 id="phase"></h2><div id="clock" hidden><span id="seconds"></span><progress id="timebar" value="60" max="60" aria-label="Tiempo de turno"></progress></div></section>
    <div class="layout">
      <section class="arena">
        <ol id="turns" class="initiative" aria-label="Orden de iniciativa"></ol>
        <div id="battlefield"><div id="board"></div><div id="animations" aria-hidden="true"></div></div>
        <div id="glyph-legend" hidden class="legend"><span>◆ Brasas · daño</span><span>◆ Veneno · daño por turno</span><span>◆ Cadenas · −2 PM</span></div>
        <div id="controls" class="actionbar"></div>
        <div id="inventory" hidden></div>
      </section>
      <aside class="panel combat-log"><h2>Registro</h2><ol id="log"></ol></aside>
    </div>
  </section>
</main><script type="module" src="./client.js?v=2"></script></body>
</html>
